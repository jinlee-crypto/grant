name: 공고 수집

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST
    - cron: "0 4 * * 1-5"  # 평일 13:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: data 브랜치 준비
        run: |
          git config --global user.name "grant-bot"
          git config --global user.email "grant-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data; then
            git fetch origin data
            git worktree add databranch origin/data
            cd databranch && git checkout -B data origin/data
          else
            git worktree add --detach databranch
            cd databranch && git checkout --orphan data && git rm -rf . -q
            mkdir -p data && echo "수집 데이터 전용 브랜치" > README.md
            git add README.md && git commit -m "data 브랜치 생성" && git push -u origin data
          fi

      - name: 수집
        env:
          GRANT_DATA: databranch/data
        run: python collector.py

      - name: 커밋
        if: always()
        working-directory: databranch
        run: |
          git add data/notices.csv data/runs.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "공고 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase origin data && git push origin HEAD:data && break; sleep 5; done
